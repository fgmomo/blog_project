{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <title>{% block title %} OM News {% endblock %}</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <script>
    document.querySelectorAll(".reply-btn").forEach((btn) => {
      btn.onclick = function () {
        this.parentElement.nextElementSibling.classList.toggle("d-none");
      };
    });
  </script>
  <body>
    {% include 'includes/navbar.html' %} {% block content %} {% endblock %}
    {%include 'includes/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'js/script.js' %}"></script>
    <script>
      document.querySelectorAll(".like-btn").forEach((btn) => {
        btn.addEventListener("click", function (e) {
          e.preventDefault();

          fetch("/blog/like/" + this.dataset.slug + "/")
            .then((response) => response.json())
            .then((data) => {
              if (data.error) {
                window.location.href = "/accounts/login/";
                return;
              }

              this.querySelector("span").textContent = data.likes;

              const icon = this.querySelector("i");

              if (data.liked) {
                icon.classList.remove("bi-heart");
                icon.classList.add("bi-heart-fill");

                this.classList.add("liked");
              } else {
                icon.classList.remove("bi-heart-fill");
                icon.classList.add("bi-heart");

                this.classList.remove("liked");
              }
            });
        });
      });
    </script>
    <script>
      document.querySelectorAll(".comment-like-btn").forEach((btn) => {
        btn.onclick = function (e) {
          e.preventDefault();

          fetch("/reactions/comment-like/" + this.dataset.id + "/")
            .then((r) => r.json())

            .then((data) => {
              this.querySelector("span").innerText = data.likes;

              let icon = this.querySelector("i");

              if (data.liked) {
                icon.classList.remove("bi-heart");

                icon.classList.add("bi-heart-fill");

                this.classList.remove("btn-outline-danger");

                this.classList.add("btn-danger");
              } else {
                icon.classList.remove("bi-heart-fill");

                icon.classList.add("bi-heart");

                this.classList.remove("btn-danger");

                this.classList.add("btn-outline-danger");
              }
            });
        };
      });
    </script>
  </body>
</html>
