{% extends 'base.html' %}
{% block title %}Email envoyé{% endblock %}
{% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <i class="bi bi-envelope-check text-primary" style="font-size:3rem"></i>
      <h2 class="mt-3 mb-2">Email envoyé</h2>
      <p class="text-muted">
        Si un compte existe avec cette adresse, un email avec les instructions
        de réinitialisation vient d'être envoyé.
      </p>
      <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">
        Retour à la connexion
      </a>
    </div>
  </div>
</div>

{% endblock %}
