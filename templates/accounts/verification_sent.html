{% extends 'base.html' %}
{% block title %}Vérifiez votre email{% endblock %}
{% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <i class="bi bi-envelope-check text-primary" style="font-size:3rem"></i>
      <h2 class="mt-3 mb-2">Vérifiez votre email</h2>
      <p class="text-muted">
        Un email de confirmation vient de vous être envoyé. Cliquez sur le
        lien qu'il contient pour activer votre compte.
      </p>
      <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">
        Retour à la connexion
      </a>
    </div>
  </div>
</div>

{% endblock %}
