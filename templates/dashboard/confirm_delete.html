{% extends 'dashboard/base_dashboard.html' %}
{% block title %} Supprimer {% endblock %}
{% block dashboard_content %}

<div class="page-header">
  <div class="eyebrow">Confirmation</div>
  <h1>Supprimer ?</h1>
</div>

<div class="dashboard-form-card">
  <p>Es-tu sûr de vouloir supprimer <strong>{{ object }}</strong> ? Cette action est irréversible.</p>

  <form method="POST">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button class="btn btn-danger">Oui, supprimer</button>
      <a href="{% url back_url_name %}" class="btn btn-outline-secondary">Annuler</a>
    </div>
  </form>
</div>

{% endblock %}
