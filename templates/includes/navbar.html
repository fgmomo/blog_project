{% load static %}

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
      <img src="{% static 'images/logo.jpg' %}" height="45" class="me-2" />
      <!-- <span>OM News</span> -->
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a
            class="nav-link {% if request.path == '/' %}active{% endif %}"
            href="{% url 'home' %}"
          >
            Accueil
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link {% if '/blog' in request.path %}active{% endif %}"
            href="{% url 'blog.index' %}"
          >
            Actualités
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link {% if '/emissions' in request.path %}active{% endif %}"
            href="{% url 'emissions.index' %}"
          >
            Émissions
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link {% if '/services' in request.path %}active{% endif %}"
            href="{% url 'core.services' %}"
          >
            Services
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link {% if '/a-propos' in request.path %}active{% endif %}"
            href="{% url 'core.about' %}"
          >
            À propos
          </a>
        </li>
      </ul>

      <form class="d-flex me-3" method="GET" action="{% url 'blog.index' %}">
        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="search"
                name="search"
                placeholder="Rechercher une actualité...">

        </div>

          <!-- <button class="btn btn-primary">
            <i class="bi bi-search"></i>
          </button> -->
        
      </form>

      {% if user.is_authenticated %}

      <div class="dropdown">
        <button class="user-menu" data-bs-toggle="dropdown">

            <div class="avatar">

                {{ user.username|first|upper }}

            </div>

            <span>

                {{ user.username }}

            </span>

            <i class="bi bi-chevron-down"></i>

        </button>

        <ul class="dropdown-menu dropdown-menu-end">

          <li>
            <a class="dropdown-item" href="{% url 'dashboard:home' %}">
              <i class="bi bi-speedometer2"></i>

              Tableau de bord
            </a>
          </li>

          <li>
            <a class="dropdown-item" href="{% url 'dashboard:profile' %}">
              <i class="bi bi-person"></i>

              Mon profil
            </a>
          </li>

          <li><hr class="dropdown-divider" /></li>

          <li>
            <a class="dropdown-item text-danger" href="{% url 'logout' %}">
              <i class="bi bi-box-arrow-right"></i>

              Déconnexion
            </a>
          </li>
        </ul>
      </div>

      {% else %}

      <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">
        Connexion
      </a>

      <a href="{% url 'signup' %}" class="btn btn-primary"> Inscription </a>

      {% endif %}
    </div>
  </div>
</nav>
